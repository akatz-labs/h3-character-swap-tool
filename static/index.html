<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>H3 Character Swap</title>
    <base href="/h3-workbench/" />
    <link rel="stylesheet" href="static/style.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="./"><img class="mark h3-brand-logo" src="static/akatz-labs.png" alt="Akatz Labs"> Character Swap</a
      ><select id="batch" aria-label="Batch"></select
      ><button id="new-batch" class="quiet">＋ New batch</button>
      <div id="workers"></div>
    </header>
    <div class="layout">
      <aside>
        <div class="sidebar-head">
          <strong>Clips <span id="clip-count"></span></strong
          ><button id="import" aria-label="Import clips" class="primary h3-import-button"><svg class="h3-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Import</button>
        </div>
        <input
          id="search"
          placeholder="Search clips"
          aria-label="Search clips"
        />
        <nav id="clips"></nav>
        <button id="batch-actions" class="queue-button"><svg class="h3-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m12 3 10 5-10 5L2 8zm-10 9 10 5 10-5M2 16l10 5 10-5"/></svg>Batch actions</button>
        <button id="queue-open" class="queue-button">
          <svg class="h3-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M9 5h12M9 12h12M9 19h12M3 5h.01M3 12h.01M3 19h.01"/></svg>Job queue <span id="queue-count">0</span>
        </button>
        <a class="queue-button h3-community-link" id="github-repo" href="https://github.com/akatz-labs/h3-character-swap" target="_blank" rel="noopener noreferrer"><svg class="h3-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 19c-4.3 1.3-4.3-2.5-6-3m12 6v-3.9a3.4 3.4 0 0 0-.9-2.7c3-.3 6.2-1.5 6.2-6.8a5.3 5.3 0 0 0-1.5-3.7 4.9 4.9 0 0 0-.1-3.7S17.5.8 15 2.6a13.3 13.3 0 0 0-6 0C6.5.8 5.3 1.2 5.3 1.2a4.9 4.9 0 0 0-.1 3.7 5.3 5.3 0 0 0-1.5 3.7c0 5.3 3.2 6.5 6.2 6.8a3.4 3.4 0 0 0-.9 2.6v4"/></svg>GitHub repository</a>
        <a class="queue-button h3-community-link h3-support-link" id="support-akatz" href="https://patreon.com/Akatz?utm_medium=unknown&amp;utm_source=join_link&amp;utm_campaign=creatorshare_creator&amp;utm_content=copyLink" target="_blank" rel="noopener noreferrer"><svg class="h3-icon h3-heart" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg>Support Akatz Labs</a>
        <footer class="h3-sidebar-footer"><span class="h3-app-version">v{{APP_VERSION}}</span><span class="h3-maker">made with <span class="h3-credit-heart" role="img" aria-label="love"><svg class="h3-icon h3-heart" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg></span> by <a href="https://github.com/akatz-ai" target="_blank" rel="noopener noreferrer">Akatz</a></span></footer>
      </aside>
      <main id="main">
        <div class="empty">Import clips to start a batch.</div>
      </main>
    </div>
    <dialog id="dialog">
      <div class="dialog-head">
        <h2 id="dialog-title"></h2>
        <button id="dialog-close" class="quiet" aria-label="Close dialog">
          ✕
        </button>
      </div>
      <div id="dialog-body"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <input id="image-upload" type="file" accept="image/*" hidden />
    <script src="static/vendor/h3-player.js"></script>
    <script src="static/vendor/app-kit-icons.js"></script>
    <script src="static/ui-icons.js"></script>
    <script src="static/comparison.js"></script>
    <script src="static/review-player.js"></script>
    <script src="static/mask-editor.js"></script>
    <script src="static/mask-playback.js"></script>
    <script src="static/shots-editor.js"></script>
    <script src="static/finish-review.js"></script>
    <script src="static/refine-editor.js"></script>
    <script src="static/workspace-ui.js"></script>
    <script src="static/shot-autosave.js"></script>
    <script src="static/segments.js"></script>
    <script src="static/app.js"></script>
  </body>
</html>
