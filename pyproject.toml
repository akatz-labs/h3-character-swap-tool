[project]
name = "h3-workbench"
version = "0.1.0"
description = "Local shot preparation, anchor generation and H3 render workbench"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.12", "numpy>=2", "pillow>=10", "scipy>=1.13", "httpx>=0.27", "faster-whisper==1.2.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
