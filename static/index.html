<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>H3 Character Swap</title>
    <base href="/h3-workbench/" />
    <link rel="stylesheet" href="static/style.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="./"><span class="mark">H3</span> Character Swap</a
      ><select id="batch" aria-label="Batch"></select
      ><button id="new-batch" class="quiet">＋ New batch</button>
      <div id="workers"></div>
    </header>
    <div class="layout">
      <aside>
        <div class="sidebar-head">
          <strong>Clips <span id="clip-count"></span></strong
          ><button id="import" aria-label="Import clips" class="primary h3-import-button"><svg class="h3-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Import</button>
        </div>
        <input
          id="search"
          placeholder="Search clips"
          aria-label="Search clips"
        />
        <nav id="clips"></nav>
        <button id="batch-actions" class="queue-button"><svg class="h3-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m12 3 10 5-10 5L2 8zm-10 9 10 5 10-5M2 16l10 5 10-5"/></svg>Batch actions</button>
        <button id="queue-open" class="queue-button">
          <svg class="h3-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M9 5h12M9 12h12M9 19h12M3 5h.01M3 12h.01M3 19h.01"/></svg>Job queue <span id="queue-count">0</span>
        </button>
      </aside>
      <main id="main">
        <div class="empty">Import clips to start a batch.</div>
      </main>
    </div>
    <dialog id="dialog">
      <div class="dialog-head">
        <h2 id="dialog-title"></h2>
        <button id="dialog-close" class="quiet" aria-label="Close dialog">
          ✕
        </button>
      </div>
      <div id="dialog-body"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <input id="image-upload" type="file" accept="image/*" hidden />
    <script src="static/vendor/h3-player.js"></script>
    <script src="static/vendor/app-kit-icons.js"></script>
    <script src="static/ui-icons.js"></script>
    <script src="static/comparison.js"></script>
    <script src="static/review-player.js"></script>
    <script src="static/mask-editor.js"></script>
    <script src="static/mask-playback.js"></script>
    <script src="static/shots-editor.js"></script>
    <script src="static/finish-review.js"></script>
    <script src="static/refine-editor.js"></script>
    <script src="static/workspace-ui.js"></script>
    <script src="static/shot-autosave.js"></script>
    <script src="static/segments.js"></script>
    <script src="static/app.js"></script>
  </body>
</html>
