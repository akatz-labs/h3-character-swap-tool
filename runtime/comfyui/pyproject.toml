[project]
name = "comfygit-env-h3-character-swap"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "aiohttp==3.14.5",
  "alembic==1.20.0",
  "av==19.0.1",
  "blake3==1.0.11",
  "comfy-aimdo==0.5.5",
  "comfy-angle==0.1.1",
  "comfy-kitchen==0.2.35",
  "comfyui-embedded-docs==0.5.12",
  "comfyui-frontend-package==1.53.6",
  "comfyui-workflow-templates==0.11.70",
  "einops==0.8.2",
  "filelock==4.1.1",
  "huggingface-hub==0.36.2",
  "kornia==0.8.3",
  "numpy==2.5.4",
  "opencv-python-headless==4.11.0.86",
  "pillow==12.3.0",
  "psutil==7.2.2",
  "pydantic==2.14.1",
  "pydantic-settings==2.15.0",
  "pyopengl==3.1.10",
  "pyyaml==6.0.3",
  "requests==2.34.2",
  "safetensors==0.8.0",
  "scipy==1.18.1",
  "sentencepiece==0.2.2",
  "simpleeval==1.0.8",
  "spandrel==0.4.2",
  "sqlalchemy==2.1.4",
  "tokenizers==0.22.2",
  "torch==2.11.0+cu128",
  "torchsde==0.2.6",
  "torchvision==0.26.0+cu128",
  "tqdm==4.70.1",
  "transformers==4.57.6",
  "yarl==1.25.1",
  "triton==3.6.0",
  "timm==1.0.19",
  "ftfy==6.3.1"
]

[tool.comfygit]
schema_version = 2
python_version = "3.12"
comfyui_version_type = "commit"
comfyui_version = "79be670e2d9be63e238785af307369d2b9039ed1"
comfyui_commit_sha = "79be670e2d9be63e238785af307369d2b9039ed1"
comfyui_repository = "https://github.com/Comfy-Org/ComfyUI.git"
headless = false

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
override-dependencies = ["uv>=0.11.8"]
exclude-dependencies = ["opencv-python", "opencv-contrib-python", "opencv-contrib-python-headless"]

[dependency-groups]
comfygit-system = ["uv>=0.11.8"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = {index = "pytorch-cu128"}
torchvision = {index = "pytorch-cu128"}
